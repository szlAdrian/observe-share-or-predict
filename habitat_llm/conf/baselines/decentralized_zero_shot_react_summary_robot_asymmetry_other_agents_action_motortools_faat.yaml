# @package _global_

defaults:
  - /examples/planner_multi_agent_demo_config
  - override /evaluation: decentralized_evaluation_runner_multi_agent
  - override /planner@evaluation.agents.agent_0.planner: llm_zero_shot_react_other_agents_action_planner
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: zero_shot_prompt
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_agent_motortools_faat
  - override /planner@evaluation.agents.agent_1.planner: llm_zero_shot_react_other_agents_action_planner
  - override /instruct@evaluation.agents.agent_1.planner.plan_config.instruct: zero_shot_prompt
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_object_states_agent_motortools_faat


agent_asymmetry: True
robot_asymmetry: True
update_other_agent_world_graph_by_agent_action: False
world_model:
  partial_obs: True

evaluation:
  agents:
    agent_0:
      planner:
        plan_config:
          constrained_generation: True
          objects_response: True
          replanning_threshold: 50
          action_description_type: 'faat' # Whether to use 'actions', 'states', or 'faat' (FindAgentActionTool) to describe the other agent's action history
          include_only_new_actions: True # Whether to only include the other agent's new actions since the last observations or include all the actions that happend so far
          llm:
            inference_mode: "rlm"
    agent_1:
      planner:
        plan_config:
          constrained_generation: True
          objects_response: True
          replanning_threshold: 50
          action_description_type: 'faat' # Whether to use 'actions', 'states', or 'faat' (FindAgentActionTool) to describe the other agent's action history
          include_only_new_actions: True # Whether to only include the other agent's new actions since the last observations or include all the actions that happend so far
          llm:
            inference_mode: "rlm"
