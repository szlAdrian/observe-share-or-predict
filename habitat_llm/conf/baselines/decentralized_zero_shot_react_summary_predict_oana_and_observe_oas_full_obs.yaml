# @package _global_

defaults:
  - /examples/planner_multi_agent_demo_config
  - override /evaluation: decentralized_evaluation_runner_multi_agent
  - override /planner@evaluation.agents.agent_0.planner: llm_zero_shot_react_predict_oana_and_observe_oas_planner
  - override /instruct@evaluation.agents.agent_0.planner.plan_config.instruct: zero_shot_prompt_predict_oana
  - override /agent@evaluation.agents.agent_0.config: oracle_rearrange_agent_motortoolsonly
  - override /planner@evaluation.agents.agent_1.planner: llm_zero_shot_react_predict_oana_and_observe_oas_planner
  - override /instruct@evaluation.agents.agent_1.planner.plan_config.instruct: zero_shot_prompt_predict_oana
  - override /agent@evaluation.agents.agent_1.config: oracle_rearrange_object_states_agent_motortoolsonly


agent_asymmetry: False
world_model:
  partial_obs: False

evaluation:
  predict_other_agent_actions: True
  pred_oaa_same_inference_mode: True
  pred_oaa_obj_class_mode: True
  agents:
    agent_0:
      planner:
        plan_config:
          include_oaa_pred_in_prompt: True
          constrained_generation: True
          response_grammar_type: "predict_oaa_obj_class" # "partner-current-next-self" "partner-next-self"
          objects_response: True
          replanning_threshold: 50
          llm:
            inference_mode: "rlm"
          instruct:
            end_expression: "My next action: Done[]"
    agent_1:
      planner:
        plan_config:
          include_oaa_pred_in_prompt: True
          constrained_generation: True
          response_grammar_type: "predict_oaa_obj_class" # "partner-current-next-self" "partner-next-self"
          objects_response: True
          replanning_threshold: 50
          llm:
            inference_mode: "rlm"
          instruct:
            end_expression: "My next action: Done[]"