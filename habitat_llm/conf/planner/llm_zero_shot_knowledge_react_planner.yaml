defaults:
  - /llm@plan_config.llm: llama
  - /instruct@plan_config.instruct: zero_shot_knowledge_inference_prompt

_target_: 'habitat_llm.planner.ZeroShotKnowledgeReactPlanner'
_recursive_: False
_partial_: True

plan_config:
    replanning_threshold: 25 # max number of times the LLM is allowed to plan to finish the task
    planning_mode: "cot"
    constrained_generation: False
    objects_response: True
    objects_response_include_states: False
    centralized: False
    enable_rag: False # If we want to use RAG or not
    rag_dataset_dir: "" # The path to the rag_data_source_name folder
    rag_data_source_name: "" # rag_data_source_name folder itself
    example_type: "react" # The prompting format
    only_last_reasoning_considered: True # Whether to leave in the prompt of the react agent only the last reasoning (generated by the reasoning agent) before the react steps or keep all the previous reasonings
