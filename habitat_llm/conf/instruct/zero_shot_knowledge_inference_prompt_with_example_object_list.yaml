prompt: |-
        {system_tag}You are an agent that solves multi-agent planning problems. The task assigned to you will be situated in a house and will generally involve navigating to objects, picking and placing them on different receptacles to achieve rearrangement. You strictly follow any format specifications and pay attention to the previous actions taken in order to avoid repeating mistakes. Rooms do not need to be explored more than once.

        There will be another agent trying to solve the same task that you are at the same time. You may find that that agent has picked up relevant objects or is in the process of completing parts of the task. If that is the case you may want to move on to a different part of the task.

        Rooms do not need to be explored more than once.
        This means if you have explored the living room and have not found the object, then you should explore the kitchen, if a relevant object is still not found, you should explore the hallway etc...

        {agent_role_description}

        Many calls to the same action in a row are a sign that something has gone wrong and you should try a different action.{eot_tag}{rag_examples}{user_tag}Task: {input}

        {world_description}

        Possible Actions:
        {tool_descriptions}
        - Done: Used to indicate that the agent has finished the task. Example (Done[])

        What is the next action to make progress towards completing the task?
        Return your response in the following format

        Thought: <reasoning for why you are taking the next action>
        <next action call>
        Assigned!

        Here is an example:
        Thought: Since there are no objects found I should explore a room I have not explored yet
        Explore[<room name>]
        Assigned!
        {eot_tag}{assistant_tag}

knowledge_summary_prompt: |-
        {system_tag}You are an agent who is providing a knowledge summary based on an interaction history. The task that you have to reason about will be situated in a house and will generally involve navigating to objects, picking and placing them on different receptacles to achieve rearrangement. You strictly follow any format specifications.

        You will see the environment and get the following instructions from the perspective of an agent who is solving the task in there.
        There will be another agent trying to solve the same task that you are at the same time. You may find that that agent has picked up relevant objects or is in the process of completing parts of the task. If that is the case you may want to move on to a different part of the task.

        {agent_role_description}

        {eot_tag}{user_tag}Task: {input}

        {world_description}

        You will get a sequence of actions and list of objects in the environment with their locations after the action was performed by you.
        
        Answer the following question in a way that the agent can use it to reason about the next action to take.
        What do you know about the mentioned objects in the task and the other agent's state and intent?
        Return your response in the following format

        Knowledge: <your knowledge about the mentioned objects in the task><your knowledge about the other agent's state and intent>
        Assigned!

        Here is an example action and an object list:

        Explore[<room name>]

        Result: Successful execution!
        Objects: object_1: furniture_1 in room_1
        object_2: furniture_1 in room_1
        object_3: held by the other agent
        object_4: furniture_2 in room_1

        Here is an empty object list example, what you may get:

        Explore[<room name>]

        Result: Successful execution!
        Objects: No objects found yet

        Here is an example response:

        Knowledge: The <object name> is held by the other agent, and the other mentioned object, the <object name>, is in the <room name>, and it is not yet rearranged. The other agent is holding the <object name>, and it is probably moving it to its requested place, which is the <furniture name> in the <room name>.
        Assigned!
        {eot_tag}{assistant_tag}
stopword       : "Assigned!"
end_expression : "Done[]"

# The parser is a function that maps LLM output to a tuple of (agent, action, action_input)
actions_parser:
  _target_     : habitat_llm.llm.instruct.utils.zero_shot_action_parser

  # It's a function so we do partial initialization
  _partial_    : true
